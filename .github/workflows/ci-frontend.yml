name: CI Frontend

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-security-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (advisory)
        run: |
          set +e
          npm audit --package-lock-only
          status=$?
          set -e
          {
            echo '## Frontend security audit (`npm audit`)'
            echo
            if [[ "$status" -eq 0 ]]; then
              echo 'No known vulnerabilities reported.'
            else
              echo "Audit reported findings (exit ${status}). Job is non-blocking."
              echo
              echo 'Full text output is in the step log above.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build
