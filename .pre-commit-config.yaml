# See https://pre-commit.com for more information
# Ruff config: backend/pyproject.toml ([tool.ruff])
# Do NOT pass --config here: from repo root that path breaks isort first-party
# detection for backend/src/...; Ruff discovers backend/pyproject.toml via cwd.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-format
        files: ^backend/src/
      - id: ruff
        args: [--fix]
        files: ^backend/src/
